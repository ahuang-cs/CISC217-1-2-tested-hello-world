name: Classroom50 Autograding

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: classroom50-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish-result:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest and create pytest JSON report
        id: pytest
        continue-on-error: true
        run: |
          pytest -v --json-report --json-report-file=pytest-report.json

      - name: Write Classroom50 result.json
        if: always()
        run: |
          python scripts/write_result_json.py
          cat result.json

      - name: Upload result.json as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-json
          path: result.json

      - name: Create Classroom50 submission release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: classroom50-submission-${{ github.run_number }}
          RELEASE_TITLE: Classroom50 Submission ${{ github.run_number }}
        run: |
          gh release create "$TAG_NAME" result.json \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Autograded Classroom50 submission for commit $GITHUB_SHA."

      - name: Fail workflow when tests fail
        if: steps.pytest.outcome == 'failure'
        run: exit 1
